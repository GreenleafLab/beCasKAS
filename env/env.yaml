name: base
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - r-base=4.4
  - bowtie2=2.5.4
  - samtools=1.21
  - bcftools=1.16
  - bedtools=2.31.1
  - macs2=2.2.9.1
  - trim-galore=0.6.10
  - cutadapt=4.9
  - fastqc=0.12.1
  - deeptools=3.5.5
  - picard=3.3.0
  - gencore=0.17.2
  - gatk4=4.6.0.0
  - ucsc-bedgraphtobigwig
  # Phase-2 tools (perbase, blast, clustalo) intentionally omitted; needed only for 5A_blast.sh equivalents (deferred to v0.3.0)
