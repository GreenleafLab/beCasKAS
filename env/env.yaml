name: base
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - r-base=4.4.3
  - bowtie2=2.5.4
  - samtools=1.21
  - bcftools
  - bedtools=2.31.1
  - guidescan=2.0.0
  - cython
  - numpy
  - pip
  - trim-galore=0.6.10
  - cutadapt=4.9
  - fastqc=0.12.1
  - deeptools=3.5.5
  - picard=3.3.0
  - gencore=0.17.2
  - gatk4=4.6.1.0
  - gcc_linux-64
  - gxx_linux-64
  - ucsc-bedgraphtobigwig
  - ucsc-bedsort
  - bioconductor-diffbind
  - bioconductor-deseq2
  - bioconductor-edger
  - bioconductor-genomicranges
  - bioconductor-rtracklayer
  - r-optparse
  - r-patchwork
  - r-ggplot2
  - r-dplyr
  - r-tidyr
  - r-scales
  - r-biocmanager
  - r-devtools
  - r-remotes
  - pip:
    - --no-binary=macs2
    - macs2==2.2.9.1
